  function bytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
  async function unlock(){
    const pw=document.getElementById('pw').value, err=document.getElementById('err');
    if(!pw){err.textContent='Type your password.';return;}
    err.textContent='Unlocking…';
    try{
      const enc=new TextEncoder();
      const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV)},key,bytes(CT));
      const html=new TextDecoder('utf-8').decode(pt);
      document.open();document.write(html);document.close();
    }catch(e){err.textContent='Wrong password — try again.';}
  }
  document.getElementById('go').addEventListener('click',unlock);
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
