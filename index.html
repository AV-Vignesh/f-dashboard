<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="mint" data-density="comfy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LoanTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#34d399; --acc-soft:rgba(52,211,153,.14); --acc-dim:rgba(52,211,153,.55);
  --pad:16px; --card-pad:16px; --fs:15px; --fs-sm:12.5px; --fs-hero:34px; --radius:18px;
}
[data-accent="mint"]{--acc:#34d399;--acc-soft:rgba(52,211,153,.14);--acc-dim:rgba(52,211,153,.55)}
[data-accent="sky"]{--acc:#38bdf8;--acc-soft:rgba(56,189,248,.14);--acc-dim:rgba(56,189,248,.55)}
[data-accent="violet"]{--acc:#a78bfa;--acc-soft:rgba(167,139,250,.14);--acc-dim:rgba(167,139,250,.55)}
[data-accent="amber"]{--acc:#fbbf24;--acc-soft:rgba(251,191,36,.14);--acc-dim:rgba(251,191,36,.55)}
[data-accent="rose"]{--acc:#fb7185;--acc-soft:rgba(251,113,133,.14);--acc-dim:rgba(251,113,133,.55)}
[data-accent="teal"]{--acc:#2dd4bf;--acc-soft:rgba(45,212,191,.14);--acc-dim:rgba(45,212,191,.55)}
[data-theme="dark"]{
  --bg:#0c0f14; --surface:#131820; --surface2:#1a212c; --line:rgba(255,255,255,.07);
  --ink:#e8edf4; --ink2:#93a0b4; --ink3:#5c6778; --danger:#f87171; --ok:#34d399;
  --chip:rgba(255,255,255,.06); --sheet:#161c26; --scrim:rgba(0,0,0,.6);
}
[data-theme="amoled"]{
  --bg:#000000; --surface:#0d0d0f; --surface2:#16161a; --line:rgba(255,255,255,.09);
  --ink:#f0f3f8; --ink2:#8f9aab; --ink3:#586274; --danger:#f87171; --ok:#34d399;
  --chip:rgba(255,255,255,.07); --sheet:#101014; --scrim:rgba(0,0,0,.75);
}
[data-theme="light"]{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#eef0f3; --line:rgba(15,23,42,.08);
  --ink:#111827; --ink2:#5b6474; --ink3:#98a1b0; --danger:#dc2626; --ok:#059669;
  --chip:rgba(15,23,42,.05); --sheet:#ffffff; --scrim:rgba(15,23,42,.35);
}
[data-density="compact"]{--pad:12px;--card-pad:12px;--fs:14px;--fs-sm:11.5px;--fs-hero:30px;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  font-size:var(--fs); line-height:1.45;
  position:fixed; inset:0;
}
#scroller{
  position:absolute; inset:0; width:100%; max-width:520px; margin:0 auto;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button,input,select,.sw,.loanrow{touch-action:manipulation}
.num{font-variant-numeric:tabular-nums; letter-spacing:-.01em}
header.app{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top)) var(--pad) 10px;
  display:flex; align-items:center; gap:12px;
}
header.app h1{font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1}
.iconbtn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink2);display:flex;align-items:center;justify-content:center;
  font-size:17px;cursor:pointer;flex-shrink:0;transition:transform .12s cubic-bezier(.23,1,.32,1);
}
.iconbtn:active{transform:scale(.94)}
main{padding:0 var(--pad)}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:var(--card-pad); margin-bottom:12px;
}
.hero{padding:calc(var(--card-pad) + 4px) var(--card-pad)}
.label{font-size:var(--fs-sm);color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.big{font-size:var(--fs-hero);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 2px}
.sub{font-size:var(--fs-sm);color:var(--ink2);font-weight:500}
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-sm);font-weight:700;
  padding:3px 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc);
}
.pill.warn{background:rgba(248,113,113,.13);color:var(--danger)}
.pill.mut{background:var(--chip);color:var(--ink2)}
.bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .5s cubic-bezier(.23,1,.32,1)}
.bar>b{position:absolute;top:0;height:100%;background:var(--acc-dim);opacity:.35;border-radius:99px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px}
.stat .label{font-size:10.5px}
.stat .v{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.loanrow{display:flex;align-items:center;gap:14px;cursor:pointer}
.loanrow:active{opacity:.75}
.ring{width:54px;height:54px;flex-shrink:0}
.loanmeta{flex:1;min-width:0}
.loanmeta h3{font-size:15.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loanmeta .sub{margin-top:1px}
.loanright{text-align:right;flex-shrink:0}
.loanright .v{font-weight:800;font-size:15.5px}
.rowline{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}
.rowline:last-child{border-bottom:0}
.rowline .t{font-weight:700;font-size:14px}
.rowline .d{font-size:var(--fs-sm);color:var(--ink2)}
.rowline .amt{font-weight:800}
.btn{
  display:block;width:100%;padding:14px;border-radius:14px;border:0;cursor:pointer;
  background:var(--acc);color:#0a0f0d;font-family:inherit;font-size:15px;font-weight:800;
  transition:transform .12s cubic-bezier(.23,1,.32,1);
}
[data-theme="light"] .btn{color:#fff}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.sm{padding:10px;font-size:13.5px;border-radius:12px;width:auto;padding-inline:16px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
.field{margin-bottom:14px}
.field label{display:block;font-size:var(--fs-sm);font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface2);color:var(--ink);font-family:inherit;font-size:16px;font-weight:600;
  outline:none;
}
.field input:focus,.field select:focus{border-color:var(--acc)}
.fieldrow{display:flex;gap:10px}
.fieldrow .field{flex:1}
.hint{font-size:var(--fs-sm);color:var(--ink3);margin-top:5px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{
  flex:1;padding:9px 6px;border:0;border-radius:10px;background:transparent;color:var(--ink2);
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
[data-theme="light"] .seg button.on{box-shadow:0 1px 3px rgba(15,23,42,.1)}
.swatches{display:flex;gap:12px;padding:4px 0}
.sw{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .12s}
.sw.on{border-color:var(--ink);transform:scale(1.08)}
nav.bottom{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:8px var(--pad) calc(8px + env(safe-area-inset-bottom));gap:8px;
}
nav.bottom button{
  flex:1;border:0;background:transparent;color:var(--ink3);font-family:inherit;cursor:pointer;
  font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;
}
nav.bottom button .ic{font-size:20px;line-height:1}
nav.bottom button.on{color:var(--acc)}
.fab{
  position:fixed;right:max(18px,calc(50vw - 242px));bottom:calc(82px + env(safe-area-inset-bottom));z-index:35;
  width:56px;height:56px;border-radius:20px;border:0;background:var(--acc);color:#0a0f0d;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:400;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35);
  transition:transform .12s cubic-bezier(.23,1,.32,1);
}
[data-theme="light"] .fab{color:#fff;box-shadow:0 6px 18px rgba(15,23,42,.2)}
.fab:active{transform:scale(.93)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .2s;backdrop-filter:blur(2px)}
.scrim.show{opacity:1}
.sheet{
  position:fixed;bottom:0;left:50%;transform:translate(-50%,102%);width:100%;max-width:520px;z-index:41;
  background:var(--sheet);border-radius:22px 22px 0 0;padding:18px var(--pad) calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;transition:transform .28s cubic-bezier(.23,1,.32,1);
}
.sheet.show{transform:translate(-50%,0)}
.sheet h2{font-size:17px;font-weight:800;margin-bottom:14px;letter-spacing:-.01em}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.toast{
  position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,10px);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.23,1,.32,1);max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:56px 24px;color:var(--ink2)}
.empty .ic{font-size:44px;margin-bottom:12px}
.empty h3{color:var(--ink);font-size:17px;font-weight:800;margin-bottom:6px}
.chartwrap{margin-top:14px}
.chartwrap svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;margin-top:8px}
.legend span{font-size:11px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.section-h .label{font-size:12px}
.section-h button{border:0;background:none;color:var(--acc);font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.doc{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc .dic{width:40px;height:40px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.doc .dm{flex:1;min-width:0;cursor:pointer}
.doc .dm .t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .del{border:0;background:none;color:var(--ink3);font-size:16px;cursor:pointer;padding:8px}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.viewer img{max-width:96vw;max-height:82vh;border-radius:8px;object-fit:contain}
.viewer .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:rgba(255,255,255,.12);color:#fff;border:0;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.backbtn{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink2);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:0}
.warnnote{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.tabs{margin:0 0 12px}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fadein{animation:fi .25s cubic-bezier(.23,1,.32,1)}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="scroller">
<header class="app" id="hdr"></header>
<main id="view"></main>
</div>
<nav class="bottom" id="bnav"></nav>
<button class="fab" id="fab" onclick="openLoanForm()" aria-label="Add loan">+</button>
<div id="overlay"></div>
<div class="toast num" id="toast"></div>

<script>
'use strict';
/* ============================================================
   LoanTrack — single-file loan portfolio tracker
   Data: localStorage (loans + settings) · IndexedDB (documents)
   Host on GitHub Pages: repo → this file as index.html → Pages on.
   ============================================================ */

/* ---------- state & persistence ---------- */
const LSKEY='loantrack_v1';
const DEFAULTS={theme:'dark',accent:'mint',currency:'compact',density:'comfy'};
let S={loans:[],settings:{...DEFAULTS}};
try{const raw=localStorage.getItem(LSKEY); if(raw){const p=JSON.parse(raw); S.loans=p.loans||[]; S.settings={...DEFAULTS,...(p.settings||{})};}}catch(e){}
function save(){ localStorage.setItem(LSKEY,JSON.stringify(S)); }
function applyPrefs(){
  const h=document.documentElement;
  h.dataset.theme=S.settings.theme; h.dataset.accent=S.settings.accent; h.dataset.density=S.settings.density;
  const tc={dark:'#0c0f14',amoled:'#000000',light:'#f4f5f7'}[S.settings.theme];
  document.querySelector('meta[name=theme-color]').setAttribute('content',tc);
}
applyPrefs();

/* ---------- IndexedDB for documents ---------- */
let _db=null;
function db(){ return _db?Promise.resolve(_db):new Promise((res,rej)=>{
  const rq=indexedDB.open('loantrack-docs',1);
  rq.onupgradeneeded=e=>{const d=e.target.result; const st=d.createObjectStore('docs',{keyPath:'id'}); st.createIndex('loanId','loanId');};
  rq.onsuccess=e=>{_db=e.target.result;res(_db)};
  rq.onerror=()=>rej(rq.error);
});}
async function docAdd(rec){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('docs','readwrite');t.objectStore('docs').put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function docList(loanId){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('docs','readonly');const rq=t.objectStore('docs').index('loanId').getAll(loanId);rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error);});}
async function docGet(id){const d=await db();return new Promise((res,rej)=>{const rq=d.transaction('docs','readonly').objectStore('docs').get(id);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function docDel(id){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('docs','readwrite');t.objectStore('docs').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function docDelByLoan(loanId){const list=await docList(loanId);for(const r of list)await docDel(r.id);}

/* ---------- helpers ---------- */
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOW=new Date();
const NOWK=NOW.getFullYear()*12+NOW.getMonth();
const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const key2ym=k=>({y:Math.floor(k/12),m:k%12});
const ym2key=(y,m)=>y*12+m;
const str2key=s=>{const[a,b]=s.split('-');return ym2key(+a,+b-1);};
const key2str=k=>{const{y,m}=key2ym(k);return `${y}-${String(m+1).padStart(2,'0')}`;};
const fmtKey=k=>{const{y,m}=key2ym(k);return `${MONS[m]} ${y}`;};
function trimN(x){ if(x>=100)return Math.round(x).toString(); const s=x.toFixed(x>=10?1:2); return s.replace(/\.?0+$/,''); }
function money(n,full){
  n=Math.round(n||0); const neg=n<0?'−':''; const a=Math.abs(n);
  if(S.settings.currency==='compact'&&!full){
    if(a>=1e7)return neg+'₹'+trimN(a/1e7)+'Cr';
    if(a>=1e5)return neg+'₹'+trimN(a/1e5)+'L';
  }
  return neg+'₹'+a.toLocaleString('en-IN');
}
const validYM=s=>/^\d{4}-(0[1-9]|1[0-2])$/.test(s||'');
function curRateOf(loan,st){
  if(!st.cur.rows.length)return loan.rate;
  const row=st.cur.rows.find(r=>r.k===Math.min(NOWK,st.cur.closureKey));
  if(row)return row.rate;
  return NOWK<str2key(loan.startDate)?loan.rate:st.cur.rows[st.cur.rows.length-1].rate;
}
function tenureStr(m){ const y=Math.floor(m/12),r=m%12; if(!y)return r+'m'; if(!r)return y+'y'; return `${y}y ${r}m`; }

/* ---------- amortization engine ---------- */
function calcEMI(P,annual,n){ const r=annual/1200; if(r<=0)return P/n; const f=Math.pow(1+r,n); return P*r*f/(f-1); }
/* simulate(loan, {ignoreEvents, extraMonthly}) — extraMonthly applies from current month onward */
function simulate(loan,opts={}){
  const start=str2key(loan.startDate);
  const emi=loan.emi&&loan.emi>0?loan.emi:calcEMI(loan.principal,loan.rate,loan.tenure);
  const events=!opts.ignoreEvents;
  const prep={}; if(events)(loan.prepayments||[]).forEach(p=>{const k=str2key(p.date.slice(0,7));prep[k]=(prep[k]||0)+p.amount;});
  const rch={}; if(events)(loan.rateChanges||[]).forEach(r=>{rch[str2key(r.date.slice(0,7))]=r.rate;});
  const extra=opts.extraMonthly||0;
  let bal=loan.principal, rate=loan.rate, ti=0, paidP=0, paidI=0, k=start, i=0, stalled=false;
  const rows=[]; const guard=loan.tenure*4+1200;
  while(bal>0.5&&i<guard){
    if(rch[k]!==undefined)rate=rch[k];
    const r=rate/1200, interest=bal*r;
    let prin=Math.min(emi,bal+interest)-interest;
    if(prin<0)prin=0;
    bal-=prin;
    let pp=prep[k]||0;
    if(extra>0&&k>=NOWK)pp+=extra;
    if(pp>0){pp=Math.min(pp,bal);bal-=pp;}
    ti+=interest;
    if(k<=NOWK){paidP+=prin+pp;paidI+=interest;}
    rows.push({k,bal:Math.max(bal,0),interest,principal:prin+pp,rate});
    if(prin<=0&&pp<=0){stalled=true;break;}
    k++;i++;
  }
  const last=rows.length?rows[rows.length-1].k:start;
  return {rows,emi,months:rows.length,totalInterest:ti,closureKey:last,paidPrincipal:paidP,paidInterest:paidI,stalled};
}
function loanStats(loan){
  const base=simulate(loan,{ignoreEvents:true});
  const cur=simulate(loan);
  const start=str2key(loan.startDate);
  let outstanding=loan.principal;
  if(NOWK>=start){
    const row=cur.rows.find(r=>r.k===NOWK)||cur.rows[cur.rows.length-1];
    outstanding=NOWK>cur.closureKey?0:(row?row.bal:0);
  }
  const pct=loan.principal>0?Math.min(100,Math.max(0,(loan.principal-outstanding)/loan.principal*100)):0;
  return {base,cur,outstanding,pct,
    interestSaved:Math.max(0,base.totalInterest-cur.totalInterest),
    monthsSaved:Math.max(0,base.months-cur.months),
    started:NOWK>=start, closed:outstanding<=0.5&&NOWK>=start};
}

/* ---------- SVG bits ---------- */
function ring(pct,size=54){
  const r=(size-8)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg class="ring" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="6"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--acc)" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-size="${size*0.24}" font-weight="800" font-family="inherit" class="num">${Math.round(pct)}%</text>
  </svg>`;
}
function balanceChart(loan,st){
  const W=340,H=130,P=6;
  const maxM=Math.max(st.base.rows.length,st.cur.rows.length)||1;
  const maxV=loan.principal||1;
  const X=i=>P+(W-2*P)*i/Math.max(maxM,1);
  const Y=v=>H-P-(H-2*P)*v/maxV;
  const pt=(i,v)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`;
  const path=(rows)=>rows.length?'M'+pt(0,loan.principal)+rows.map((r,i)=>'L'+pt(i+1,r.bal)).join(''):'';
  const basePath=path(st.base.rows), curPath=path(st.cur.rows);
  const area=curPath?curPath+`L${pt(st.cur.rows.length,0)}L${pt(0,0)}Z`:'';
  let nowX=null;
  if(st.started&&!st.closed){
    const idx=Math.min(NOWK-str2key(loan.startDate)+1,maxM);
    nowX=X(idx);
  }
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}">
    ${area?`<path d="${area}" fill="var(--acc-soft)"/>`:''}
    ${basePath?`<path d="${basePath}" fill="none" stroke="var(--ink3)" stroke-width="1.6" stroke-dasharray="4 4"/>`:''}
    ${curPath?`<path d="${curPath}" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linecap="round"/>`:''}
    ${nowX!==null?`<line x1="${nowX}" y1="${P}" x2="${nowX}" y2="${H-P}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="2 3"/>`:''}
  </svg>
  <div class="legend">
    <span><i style="background:var(--acc)"></i>With prepayments</span>
    <span><i style="background:var(--ink3)"></i>Original schedule</span>
  </div></div>`;
}

function go(view,loanId,opts={}){

async function loadDocs(loanId){
  const el=$('doclist'); if(!el)return;
  let list=[]; try{list=await docList(loanId);}catch(e){el.innerHTML=`<div class="sub">Document storage unavailable in this browser.</div>`;return;}
  if(!list.length){el.innerHTML=`<div class="sub" style="padding:6px 0">Sanction letter, agreement, statements, prepayment receipts — keep them all here. Stored only on this device.</div>`;return;}
  list.sort((a,b)=>b.added-a.added);
  el.innerHTML=list.map(d=>`
    <div class="doc">
      <div class="dic">${d.type.startsWith('image')?'🖼':'📄'}</div>
      <div class="dm" onclick="openDoc('${d.id}')">
        <div class="t">${esc(d.name)}</div>
        <div class="d sub num">${(d.size/1024).toFixed(0)} KB · ${new Date(d.added).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</div>
      </div>
      <button class="del" onclick="removeDoc('${d.id}','${loanId}')">✕</button>
    </div>`).join('');
}
async function openDoc(id){
  const d=await docGet(id); if(!d)return;
  const url=URL.createObjectURL(d.blob);
  const showViewer=inner=>{
    const w=document.createElement('div');w.className='viewer';
    w.innerHTML=`<button class="x">✕</button>${inner}<div class="sub" style="color:#cbd5e1">${esc(d.name)}</div>`;
    w.querySelector('.x').onclick=()=>{closeSheet();URL.revokeObjectURL(url);};
    document.body.appendChild(w);
    lockBody();overlayOpen=true;history.pushState({route:{...route},ov:1},'');
  };
  if(d.type.startsWith('image')){
    showViewer(`<img src="${url}">`);
  }else if(d.type==='application/pdf'){
    showViewer(`<iframe src="${url}" style="width:96vw;height:82vh;border:0;border-radius:8px;background:#fff"></iframe>`);
  }else{
    const f=new File([d.blob],d.name,{type:d.type||'application/octet-stream'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:d.name});}catch(e){}
    }else{
      const a=document.createElement('a');a.href=url;a.download=d.name;a.target='_blank';a.rel='noopener';a.click();
    }
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }
}
async function removeDoc(id,loanId){ if(!confirm('Delete this document?'))return; await docDel(id); toast('Deleted'); loadDocs(loanId); }

/* ---------- sheets & overlays ---------- */
function sheet(html,onmount){
  const o=$('overlay');
  o.innerHTML=`<div class="scrim"></div><div class="sheet"><div class="grab"></div>${html}</div>`;
  const sc=o.querySelector('.scrim'),sh=o.querySelector('.sheet');
  requestAnimationFrame(()=>{sc.classList.add('show');sh.classList.add('show');});
  sc.onclick=closeSheet;
  lockBody(); overlayOpen=true;
  history.pushState({route:{...route},ov:1},'');
  /* keep focused inputs visible above the keyboard */
  sh.addEventListener('focusin',e=>{
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))
      setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250);
  });
  if(onmount)onmount(sh);
}
function destroyOverlays(){
  overlayOpen=false; unlockBody();
  document.querySelectorAll('.viewer').forEach(v=>v.remove());
  const o=$('overlay'),sc=o.querySelector('.scrim'),sh=o.querySelector('.sheet');
  if(sh){sc.classList.remove('show');sh.classList.remove('show');setTimeout(()=>o.innerHTML='',280);}
}
function closeSheet(){
  destroyOverlays();
  if(history.state&&history.state.ov){suppressPop=true;history.back();}
}
function balanceAt(loan,k){
  if(k<str2key(loan.startDate))return loan.principal;
  const sim=simulate(loan);
  const row=sim.rows.find(r=>r.k===k);
  if(row)return row.bal;
  return k>sim.closureKey?0:loan.principal;
}
function openPrepay(loanId){
  const l=S.loans.find(x=>x.id===loanId);
  const cur=key2str(NOWK);
  sheet(`<h2>Log a prepayment</h2>
    <div class="field"><label>Month</label><input id="ppD" type="month" placeholder="YYYY-MM" value="${cur}">
      <div class="hint num" id="ppBal"></div></div>
    <div class="field"><label>Amount (₹)</label><input id="ppA" type="number" inputmode="numeric" placeholder="50000"></div>
    <div class="field"><label>Note (optional)</label><input id="ppN" type="text" placeholder="Bonus, maturity, foreclosure…"></div>
    <button class="btn ghost" id="ppFull" style="margin-bottom:10px">Pay full balance & close loan</button>
    <button class="btn" id="ppGo">Save prepayment</button>`,
    sh=>{
      const dEl=sh.querySelector('#ppD'),aEl=sh.querySelector('#ppA'),balEl=sh.querySelector('#ppBal');
      let curBal=0;
      const updBal=()=>{
        if(!validYM(dEl.value)){balEl.textContent='';return;}
        curBal=balanceAt(l,str2key(dEl.value));
        balEl.textContent=curBal>0
          ?`Balance in ${fmtKey(str2key(dEl.value))} after that month's EMI: ${money(curBal,true)} — pay this to close.`
          :`Loan is already projected closed by ${fmtKey(str2key(dEl.value))}.`;
      };
      dEl.oninput=updBal; dEl.onchange=updBal; updBal();
      sh.querySelector('#ppFull').onclick=()=>{
        if(curBal<=0){toast('Nothing left to pay in that month');return;}
        aEl.value=Math.ceil(curBal);
        const nEl=sh.querySelector('#ppN'); if(!nEl.value)nEl.value='Foreclosure';
        toast('Amount set to full payoff — hit Save');
      };
      sh.querySelector('#ppGo').onclick=()=>{
        const a=+aEl.value, d=dEl.value;
        if(!a||a<=0||!validYM(d)){toast('Enter amount and month (YYYY-MM)');return;}
        (l.prepayments=l.prepayments||[]).push({id:uid(),date:d,amount:a,note:sh.querySelector('#ppN').value.trim()});
        save();closeSheet();
        const closedNow=loanStats(l).closed;
        toast(closedNow?'Loan closed 🎉':'Prepayment logged');
        rerender();
      };
    });
}
function delPrepay(loanId,id){
  const l=S.loans.find(x=>x.id===loanId);
  l.prepayments=(l.prepayments||[]).filter(p=>p.id!==id);
  save();rerender();toast('Removed');

function openRate(loanId){
  const l=S.loans.find(x=>x.id===loanId);

  const l=S.loans.find(x=>x.id===loanId);

  };
  ['fP','fR','fT'].forEach(i=>$(i).oninput=hint); hint();
  $('fGo').onclick=()=>{
    const name=$('fName').value.trim(), P=+$('fP').value, R=+$('fR').value, T=Math.round(+$('fT').value), Sd=$('fS').value, E=+$('fE').value||0;
    if(!name){toast('Give the loan a name');return;}
    if(!(P>0)||!(R>0)||!(T>0)||!Sd){toast('Fill principal, rate, tenure and start');return;}
    if(!validYM(Sd)){toast('Start month must be YYYY-MM');return;}
    if(E>0&&E<=P*R/1200){toast('EMI is below monthly interest — it will never close');return;}
    const rec={...(editing||{id:uid(),prepayments:[],rateChanges:[]}),name,lender:$('fLender').value.trim(),type:$('fType').value,principal:P,rate:R,tenure:T,startDate:Sd,emi:E>0?E:null};
    if(editing){const i=S.loans.findIndex(x=>x.id===editing.id);S.loans[i]=rec;}else S.loans.push(rec);
    save();toast(editing?'Saved':'Loan added');go('detail',rec.id,{replace:true});
  };
}
async function deleteLoan(id){
  if(!confirm('Delete this loan and all its documents? This cannot be undone.'))return;
  S.loans=S.loans.filter(x=>x.id!==id); save();
  try{await docDelByLoan(id);}catch(e){}
  toast('Loan deleted'); go('dash',null,{replace:true});
}

/* ---------- settings ---------- */
function renderSettings(){
  $('hdr').innerHTML=`<h1>Settings</h1>`;
  const s=S.settings;
  $('view').innerHTML=`
  <div class="card${FD()}">
    <div class="label" style="margin-bottom:10px">Theme</div>
    <div class="seg" id="segTheme">
      ${[['dark','Dark'],['amoled','AMOLED'],['light','Light']].map(([v,t])=>`<button data-v="${v}" class="${s.theme===v?'on':''}">${t}</button>`).join('')}
    </div>
    <div class="label" style="margin:18px 0 10px">Accent</div>
    <div class="swatches" id="swAcc">
      ${[['mint','#34d399'],['sky','#38bdf8'],['violet','#a78bfa'],['amber','#fbbf24'],['rose','#fb7185'],['teal','#2dd4bf']]
        .map(([v,c])=>`<div class="sw ${s.accent===v?'on':''}" data-v="${v}" style="background:${c}"></div>`).join('')}
    </div>
    <div class="label" style="margin:18px 0 10px">Amount format</div>
    <div class="seg" id="segCur">
      <button data-v="compact" class="${s.currency==='compact'?'on':''}">₹35L / ₹1.2Cr</button>
      <button data-v="full" class="${s.currency==='full'?'on':''}">₹35,00,000</button>
    </div>
    <div class="label" style="margin:18px 0 10px">Density</div>
    <div class="seg" id="segDen">
      <button data-v="comfy" class="${s.density==='comfy'?'on':''}">Comfy</button>
      <button data-v="compact" class="${s.density==='compact'?'on':''}">Compact</button>
    </div>
  </div>
  <div class="card${FD()}">
    <div class="label" style="margin-bottom:10px">Data</div>
    <div class="btnrow">
      <button class="btn ghost" onclick="exportData()">Export backup</button>
      <button class="btn ghost" onclick="$('impfile').click()">Import backup</button>
    </div>
    <input type="file" id="impfile" hidden accept=".json,application/json">
    <div class="hint" style="margin-top:10px">Backup covers loans and settings as JSON. Documents stay in this browser's storage and are not included — re-upload them if you move devices.</div>
    <br><button class="btn danger" onclick="wipeAll()">Erase all data</button>
  </div>
  <div class="sub" style="text-align:center;padding:8px 0 20px">All data lives on this device only. Nothing is sent anywhere.</div>`;
  const wire=(id,key)=>{$(id).querySelectorAll('button,.sw').forEach(b=>b.onclick=()=>{S.settings[key]=b.dataset.v;save();applyPrefs();rerender();});};
  wire('segTheme','theme');wire('swAcc','accent');wire('segCur','currency');wire('segDen','density');
  $('impfile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{
      const p=JSON.parse(rd.result);
      if(!Array.isArray(p.loans))throw 0;
      if(!confirm(`Import ${p.loans.length} loan(s)? This replaces current data.`))return;
      S={loans:p.loans,settings:{...DEFAULTS,...(p.settings||{})}};save();applyPrefs();toast('Backup imported');go('dash');
    }catch(err){toast('Not a valid backup file');}};
    rd.readAsText(f); e.target.value='';
  };
}
function exportData(){
  const blob=new Blob([JSON.stringify({loans:S.loans,settings:S.settings,exported:new Date().toISOString()},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`loantrack-backup-${key2str(NOWK)}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Backup downloaded');
}
function wipeAll(){
  if(!confirm('Erase every loan, document and setting on this device?'))return;
  localStorage.removeItem(LSKEY);
  indexedDB.deleteDatabase('loantrack-docs');
  S={loans:[],settings:{...DEFAULTS}};applyPrefs();toast('Everything erased');go('dash');
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

render();
</script>
</body>
</html>
